services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: freight
      POSTGRES_PASSWORD: freight
      POSTGRES_DB: freight_ai
    ports:
      # Host 5433 — Mac pe Homebrew Postgres already 5432 use karta hai
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freight -d freight_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://freight:freight@postgres:5432/freight_ai
      DATABASE_URL_SYNC: postgresql+psycopg2://freight:freight@postgres:5432/freight_ai
      FASTER_WHISPER_ENABLED: "true"
      FASTER_WHISPER_MODEL: large-v3
      FASTER_WHISPER_DEVICE: cpu
      FASTER_WHISPER_COMPUTE_TYPE: int8
      HF_HOME: /models
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - whisper_models:/models
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  whisper_models:
